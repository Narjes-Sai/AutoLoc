$kind: http-request
url: "{{baseUrl}}/api/agences/{{agenceId}}"
method: PUT
body:
  type: json
  content: '  { "nom": "Agence Sfax", "ville": "Sfax", "adresse": "5 Rue de la Liberté", "telephone": "74000000" }'
scripts:
